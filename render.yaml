services:
  # YouTube Shorts - runs every 2 hours (to stay within free tier)
  - type: cron
    name: youtube-shorts-automator
    env: python
    region: oregon
    plan: free
    schedule: "0 */2 * * *"
    buildCommand: "apt-get update && apt-get install -y ffmpeg fonts-dejavu-core && pip install -r requirements.txt"
    startCommand: "python main.py"
    
  # YouTube Long Videos - runs every 2 hours offset by 1 hour
  - type: cron
    name: youtube-long-automator
    env: python
    region: oregon
    plan: free
    schedule: "0 1-23/2 * * *"
    buildCommand: "apt-get update && apt-get install -y ffmpeg fonts-dejavu-core && pip install -r requirements.txt"
    startCommand: "python main_long.py"
