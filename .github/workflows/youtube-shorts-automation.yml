name: YouTube Shorts Automation

on:
  # Run every 1 hour
  schedule:
    - cron: '0 * * * *'  # Every hour at minute 0
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup credentials from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
        run: |
          # Create client_secret.json from secret
          echo "$CLIENT_SECRET_JSON" > client_secret.json
          
          # Decode and create token.pickle from base64 secret
          if [ -n "$TOKEN_PICKLE_BASE64" ]; then
            echo "$TOKEN_PICKLE_BASE64" | base64 -d > token.pickle
            echo "✓ Created token.pickle from secret"
          fi
      
      - name: Create .env file from secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BING_AUTH_COOKIE: ${{ secrets.BING_AUTH_COOKIE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          cat > .env << EOF
          # YouTube API
          YOUTUBE_API_KEY="$YOUTUBE_API_KEY"
          CLIENT_SECRETS_FILE="client_secret.json"
          
          # Bing Image Creator
          BING_AUTH_COOKIE="$BING_AUTH_COOKIE"
          
          # Pexels API
          PEXELS_API_KEY="$PEXELS_API_KEY"
          
          # Pixabay API
          PIXABAY_API_KEY="$PIXABAY_API_KEY"
          
          # Gemini API Keys (comma-separated for automatic fallback)
          GEMINI_API_KEYS="$GEMINI_API_KEYS"
          
          # ElevenLabs API
          ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY"
          EOF
          echo "✓ Created .env file from secrets"
      
      - name: Generate and upload YouTube Short
        run: |
          python main.py
      
      - name: Upload logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ github.run_number }}
          path: |
            automation_log.txt
            *.log
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f .env
          rm -f client_secret.json
          rm -f token.pickle
