name: YouTube Shorts Automation (Hourly Schedule - IST)

on:
  schedule:
    # Runs every hour according to IST (UTC+5:30)
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  generate-and-upload-shorts:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set timezone to IST
      run: |
        sudo timedatectl set-timezone Asia/Kolkata
        date

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg espeak espeak-ng libespeak1

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file with secrets
      run: |
        echo "GEMINI_API_KEYS=${{ secrets.GEMINI_API_KEYS }}" >> .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
        echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}" >> .env
        echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env

    - name: Set up YouTube credentials
      run: |
        echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
        echo '${{ secrets.TOKEN_PICKLE_BASE64 }}' | base64 -d > token.pickle

    - name: Run YouTube Shorts generation
      run: |
        echo "📱 Creating YouTube Short at $(date)"
        python main.py
      env:
        PYTHONUNBUFFERED: 1
        TZ: Asia/Kolkata

    - name: Upload artifacts (if needed for debugging)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          *.log
          *.txt
